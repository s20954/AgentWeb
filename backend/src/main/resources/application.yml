server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: minsu-agent-backend
  # 强制 JVM 使用 UTF-8（Windows 默认 GBK 会导致中文日志乱码）
  mandatory-file-encoding: UTF-8
  # 兜底读取 deploy/.env（OS 环境变量优先级仍最高）。
  # 修复：后端进程能否走 LLM 分支曾取决于「启动终端是否 export 了 LLM_API_KEY」，
  # 现在即使终端没配，也会自动加载 deploy/.env，避免静默降级为联网拼接。
  config:
    import:
      - optional:file:./deploy/.env[.properties]
      - optional:file:../deploy/.env[.properties]

# 日志
logging:
  level:
    com.minsu: INFO

# 应用自定义配置（后续 RAG / LLM / 视觉模型在此扩展，密钥走环境变量）
app:
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
  vision:
    base-url: ${VISION_BASE_URL:}
    api-key: ${VISION_API_KEY:}
    model: ${VISION_MODEL:}
  vector-db-path: ${VECTOR_DB_PATH:./data/vectors.db}
