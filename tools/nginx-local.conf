# 本地联调用 Nginx 配置（Windows）
# 与 deploy/nginx-minsu.conf 逻辑完全一致，仅改两点：
#   1) listen 8088（避免与后端 8080 冲突，也避开 80 需管理员权限）
#   2) root 指向本地 dist
# 用途：验证「前端静态 + /api 反代 + SSE 关缓冲」生产形态是否正常

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       ./nginx-1.26.2/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       8088;
        server_name  localhost;

        root   ../frontend/dist;
        index  index.html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1k;

        # SSE 流式接口：必须放在 /api/ 之前，关闭缓冲 + 长超时
        location /api/chat/stream {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # 后端 API 反向代理
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # 前端静态资源缓存
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Vue Router history 模式：刷新不 404
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
